name: "Cuonztech Privacy Chaos Gate"
description: "CI gate that stress-tests cookie consent banners, judges findings per jurisdiction and proposes fixes (PR for OneTrust/Cookiebot)"
author: "Cuonztech"
branding:
  icon: "shield"
  color: "purple"

inputs:
  staging-url:
    description: "The URL of the staging or localhost web environment to stress-test"
    required: true
  api-key:
    description: "API key for the optional LLM patch generation. Only OpenAI is implemented (llm-provider openai); other providers fall back to the built-in rules. Has no effect without llm-remediation: true. Passed via the CPCG_LLM_API_KEY environment variable."
    required: false
    default: ""
  llm-remediation:
    description: "Opt-in: allow the source code to be sent to the LLM provider (OpenAI only) to generate patches (needs api-key). Off by default; only passed on if the installed CLI supports it."
    required: false
    default: "false"
  allow-custom-banner-fix:
    description: "Opt-in: the auto-fix may change scripts even when the site uses its own banner (no supported CMP). Off by default: then only manual steps are reported. Only passed on if the installed CLI supports it."
    required: false
    default: "false"
  llm-provider:
    description: "LLM provider for auto-remediation. Only 'openai' is implemented; 'anthropic' and 'gemini' fall back to the built-in rules."
    required: false
    default: "openai"
  llm-model:
    description: "Model to use for auto-remediation"
    required: false
    default: "gpt-4o"
  auto-fix:
    description: "Generate and apply code patches on the runner when tracker leaks are detected. Off by default: a gate should not silently change files; combine with create-pr to receive the fix as a pull request."
    required: false
    default: "false"
  fail-on-leak:
    description: "Block the build (exit code 1) if unpatched critical leaks remain"
    required: false
    default: "true"
  fail-on-uncheckable:
    description: "Block the build (exit code 4) if core scenarios could not be checked conclusively (e.g. consent banner not found). Only passed on if the installed CLI supports it; otherwise a warning is printed."
    required: false
    default: "true"
  strict:
    description: "Hints (purely functional third parties such as Google Fonts) also block the gate. Off by default: they are reported as hints, not as blockers. Only passed on if the installed CLI supports it."
    required: false
    default: "false"
  ignore:
    description: "Findings to ignore: tracker name or host pattern, one per line or comma-separated (e.g. fonts.googleapis.com or *.hotjar.com). Ignored findings are listed as ignored in the report."
    required: false
    default: ""
  accept-selector:
    description: "Own CSS selector of the accept button, one per line (when the built-in CMP detection does not find it)"
    required: false
    default: ""
  reject-selector:
    description: "Own CSS selector of the reject button, one per line"
    required: false
    default: ""
  settings-selector:
    description: "Own CSS selector of the settings button, one per line"
    required: false
    default: ""
  banner-frame:
    description: "Part of the URL of the iframe that contains the consent banner (CMP inside a frame)"
    required: false
    default: ""
  max-subpages:
    description: "Maximum number of linked subpages checked for trackers (default 12, max 40; larger values take longer)"
    required: false
    default: ""
  sitemap:
    description: "Deep run: check subpages from robots.txt/sitemap.xml and homepage links until deep-budget is used up (true/false)"
    required: false
    default: "false"
  deep-budget:
    description: "Time budget of the sitemap deep run for subpages in seconds (30-3600, default 300)"
    required: false
    default: ""
  deep-state:
    description: "State file of the deep run; the next run continues with unchecked subpages (persist it with actions/cache)"
    required: false
    default: ""
  baseline-report:
    description: "Report JSON of an earlier run; the report lists new, resolved and unchanged findings (restore it e.g. with actions/cache or download-artifact)"
    required: false
    default: ""
  har:
    description: "Record a HAR file per browser context without bodies into evidence/har next to the report (true/false)"
    required: false
    default: "false"
  verify-url:
    description: "Closed loop: if the target URL has findings, also scan this URL (e.g. the preview deployment of the fix PR); only a clean, complete scan there counts as 'fix verified'"
    required: false
    default: ""
  verify-wait:
    description: "Seconds to wait until verify-url is reachable (0-1800, default 0)"
    required: false
    default: ""
  target-headers:
    description: "Allowlist headers for your own site only, one 'Name: value' per line (e.g. WAF bypass or 'x-vercel-protection-bypass: ...'). Pass from secrets; sent only to the target/verify origin, never to third parties, never printed. Passed via the CPCG_TARGET_HEADERS environment variable."
    required: false
    default: ""
  banner-wait:
    description: "Seconds to wait for a late consent banner (1-60; default as in the CLI)"
    required: false
    default: ""
  report-output:
    description: "File path where the JSON LeakReport will be written"
    required: false
    default: "reports/privacy-chaos-report.json"
  target-source-dir:
    description: "Root directory of the application source code to inspect and patch"
    required: false
    default: "."
  git-commit:
    description: "Commit generated privacy fixes into the checked-out branch (requires auto-fix and a valid license; skipped without one)"
    required: false
    default: "false"
  create-pr:
    description: "Create a fix branch and open a GitHub Pull Request with the generated fix (requires auto-fix, github-token and a valid license; takes precedence over git-commit)"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for create-pr (contents: write and pull-requests: write). Passed via the GITHUB_TOKEN environment variable, never on the command line."
    required: false
    default: ""
  license:
    description: "CuonzTech CPCG license (CPCG-… or customer key CPCG-K-…) — from secrets, after online purchase. Not needed for scan and console gate; required for customer report/PDF, git-commit and create-pr. Passed via the CPCG_LICENSE environment variable."
    required: false
    default: ""
  report-pdf:
    description: "Create the deluxe PDF (cover page + evidence) after the scan. Requires a valid license; skipped without one."
    required: false
    default: "false"
  client-name:
    description: "Client name for the customer report and the PDF cover page. Requires a valid license."
    required: false
    default: ""
  jurisdiction:
    description: "Jurisdictions whose rules decide what blocks the gate, comma-separated: CH | EU | UK | US-CA | BR | ROW (strictest wins; default CH,EU as in the CLI)"
    required: false
    default: "CH,EU"

outputs:
  leaks-found:
    description: "'true' if leaks were detected during chaos tests"
    value: ${{ steps.cpcg-run.outputs.leaks_found }}
  leaks-count:
    description: "Number of tracker leaks detected"
    value: ${{ steps.cpcg-run.outputs.leaks_count }}
  patch-applied:
    description: "'true' if an auto-remediation patch was successfully applied"
    value: ${{ steps.cpcg-run.outputs.patch_applied }}
  report-path:
    description: "Absolute or relative path to the generated JSON report"
    value: ${{ steps.cpcg-run.outputs.report_path }}
  gate_state:
    description: "Gate result as written by the CLI: clean, remediated (fix verified by re-scan), fix-proposed, blocked, inconclusive. Empty if the installed CLI predates this output."
    value: ${{ steps.cpcg-run.outputs.gate_state }}
  incomplete:
    description: "'true' if core scenarios could not be checked conclusively"
    value: ${{ steps.cpcg-run.outputs.incomplete }}
  uncheckable_count:
    description: "Number of scenarios that could not be checked"
    value: ${{ steps.cpcg-run.outputs.uncheckable_count }}
  leak_requests:
    description: "Number of blocking tracker requests/cookies (before consent, after reject/revoke and the other blocking phases)"
    value: ${{ steps.cpcg-run.outputs.leak_requests }}
  verified:
    description: "true if a re-scan (verify-url or target URL after a local fix) was clean and complete, false if not, empty if no re-scan ran"
    value: ${{ steps.cpcg-run.outputs.verified }}
  exit_code:
    description: "Exit code of the CLI (0 ok, 1 leaks, 2 license invalid or revoked, 3 error, 4 incomplete)"
    value: ${{ steps.cpcg-run.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    # Installationsschritt: bewusst ohne Secrets (Lizenz, Token, API-Key) in der Umgebung. Nur hier läuft npm.
    - name: Install Privacy Chaos Gate
      id: cpcg-install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CPCG_PINNED_VERSION: "0.3.2" # = package.json version; bei jedem Release mit anheben (tests/action-pin.test.ts prüft das)
      run: |
        set -euo pipefail

        CLI_PATH="$ACTION_PATH/dist/cli.js"
        if [ -f "$CLI_PATH" ]; then
          # Eigener Build im Action-Pfad (Repo-CI): Abhängigkeiten und Browser bringt der Workflow mit.
          echo "cli=$CLI_PATH" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Veröffentlichtes Paket in der gepinnten Version. Lifecycle-Skripte der Abhängigkeiten laufen nicht
        # (--ignore-scripts); der Playwright-Browser wird unten ausdrücklich installiert.
        TOOL_DIR="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/cpcg-XXXXXX")"
        npm install --prefix "$TOOL_DIR" --ignore-scripts --no-audit --no-fund --loglevel=error "cuonztech-privacy-chaos-gate@${CPCG_PINNED_VERSION}"
        PW_CLI="$TOOL_DIR/node_modules/playwright/cli.js"
        if [ -f "$PW_CLI" ]; then
          node "$PW_CLI" install --with-deps chromium
        else
          npx --yes playwright install --with-deps chromium
        fi
        echo "cli=$TOOL_DIR/node_modules/cuonztech-privacy-chaos-gate/dist/cli.js" >> "$GITHUB_OUTPUT"

    - name: Run Privacy Chaos Gate
      id: cpcg-run
      shell: bash
      # Alle Inputs gelangen nur über env in das Skript (keine ${{ }}-Interpolation im run-Block:
      # sonst könnten Input-Werte als Shell-Code ausgeführt werden). Die Lizenz steht nie in der Kommandozeile.
      env:
        CPCG_CLI: ${{ steps.cpcg-install.outputs.cli }}
        CPCG_LLM_API_KEY: ${{ inputs.api-key }}
        CPCG_LLM_PROVIDER: ${{ inputs.llm-provider }}
        CPCG_LLM_MODEL: ${{ inputs.llm-model }}
        CPCG_LICENSE: ${{ inputs.license }}
        CPCG_TARGET_HEADERS: ${{ inputs.target-headers }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        IN_STAGING_URL: ${{ inputs.staging-url }}
        IN_LLM_REMEDIATION: ${{ inputs.llm-remediation }}
        IN_ALLOW_CUSTOM_BANNER_FIX: ${{ inputs.allow-custom-banner-fix }}
        IN_AUTO_FIX: ${{ inputs.auto-fix }}
        IN_FAIL_ON_LEAK: ${{ inputs.fail-on-leak }}
        IN_FAIL_ON_UNCHECKABLE: ${{ inputs.fail-on-uncheckable }}
        IN_STRICT: ${{ inputs.strict }}
        IN_IGNORE: ${{ inputs.ignore }}
        IN_ACCEPT_SELECTOR: ${{ inputs.accept-selector }}
        IN_REJECT_SELECTOR: ${{ inputs.reject-selector }}
        IN_SETTINGS_SELECTOR: ${{ inputs.settings-selector }}
        IN_BANNER_FRAME: ${{ inputs.banner-frame }}
        IN_MAX_SUBPAGES: ${{ inputs.max-subpages }}
        IN_BANNER_WAIT: ${{ inputs.banner-wait }}
        IN_SITEMAP: ${{ inputs.sitemap }}
        IN_DEEP_BUDGET: ${{ inputs.deep-budget }}
        IN_DEEP_STATE: ${{ inputs.deep-state }}
        IN_BASELINE: ${{ inputs.baseline-report }}
        IN_HAR: ${{ inputs.har }}
        IN_VERIFY_URL: ${{ inputs.verify-url }}
        IN_VERIFY_WAIT: ${{ inputs.verify-wait }}
        IN_REPORT_OUTPUT: ${{ inputs.report-output }}
        IN_SOURCE_DIR: ${{ inputs.target-source-dir }}
        IN_GIT_COMMIT: ${{ inputs.git-commit }}
        IN_CREATE_PR: ${{ inputs.create-pr }}
        IN_REPORT_PDF: ${{ inputs.report-pdf }}
        IN_CLIENT: ${{ inputs.client-name }}
        IN_JURISDICTION: ${{ inputs.jurisdiction }}
      run: |
        set -euo pipefail

        # Freigabe-Header-Werte im Log maskieren (auch wenn sie nicht aus secrets stammen).
        while IFS= read -r line; do
          value="${line#*:}"
          value="${value#"${value%%[![:space:]]*}"}"
          if [ -n "$value" ] && [ "$value" != "$line" ]; then echo "::add-mask::$value"; fi
        done <<< "${CPCG_TARGET_HEADERS:-}"

        RUNNER=(node "$CPCG_CLI")

        # Optionen immer als --name=wert: ein Wert, der mit "-" beginnt, wird so nie als eigene Option gelesen.
        ARGS=(
          "--url=$IN_STAGING_URL"
          "--auto-fix=$IN_AUTO_FIX"
          "--fail-on-leak=$IN_FAIL_ON_LEAK"
          "--report-output=$IN_REPORT_OUTPUT"
          "--source-dir=$IN_SOURCE_DIR"
          "--git-commit=$IN_GIT_COMMIT"
          "--create-pr=$IN_CREATE_PR"
          "--report-pdf=$IN_REPORT_PDF"
          "--jurisdiction=$IN_JURISDICTION"
        )
        if [ -n "$IN_CLIENT" ]; then
          ARGS+=("--client=$IN_CLIENT")
        fi

        # Neuere Optionen nur weitergeben, wenn die installierte CLI sie kennt (ältere Versionen würden sonst mit
        # "unknown option" abbrechen). Kennt sie eine gewünschte Option nicht, wird das gemeldet, nicht still übergangen.
        HELP="$("${RUNNER[@]}" --help 2>&1 || true)"
        supports() { printf '%s\n' "$HELP" | grep -q -- "$1"; }
        warn_unsupported() {
          echo "::warning title=CPCG::Die installierte CLI kennt --$1 nicht; der Input wird ignoriert. Paket- und Action-Version angleichen."
        }
        # Boolesche Option: übergeben, wenn bekannt; unbekannt und angefordert ("true") → Warnung.
        opt_bool() {
          if supports "--$1"; then
            ARGS+=("--$1=$2")
          elif [ "$2" = "true" ]; then
            warn_unsupported "$1"
          fi
          return 0
        }
        # Wert-Option (mehrzeilig erlaubt: je nichtleere Zeile eine Option): nur wenn gesetzt.
        opt_lines() {
          local flag="$1" value="$2" line
          [ -n "${value//[[:space:]]/}" ] || return 0
          if ! supports "--$flag"; then
            warn_unsupported "$flag"
            return 0
          fi
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            if [ -n "$line" ]; then ARGS+=("--$flag=$line"); fi
          done <<< "$value"
          return 0
        }
        opt_bool fail-on-uncheckable "$IN_FAIL_ON_UNCHECKABLE"
        opt_bool llm-remediation "$IN_LLM_REMEDIATION"
        opt_bool allow-custom-banner-fix "$IN_ALLOW_CUSTOM_BANNER_FIX"
        opt_bool strict "$IN_STRICT"
        opt_lines ignore "$IN_IGNORE"
        opt_lines accept-selector "$IN_ACCEPT_SELECTOR"
        opt_lines reject-selector "$IN_REJECT_SELECTOR"
        opt_lines settings-selector "$IN_SETTINGS_SELECTOR"
        opt_lines banner-frame "$IN_BANNER_FRAME"
        opt_lines max-subpages "$IN_MAX_SUBPAGES"
        opt_lines banner-wait "$IN_BANNER_WAIT"
        opt_bool sitemap "${IN_SITEMAP:-false}"
        opt_lines deep-budget "${IN_DEEP_BUDGET:-}"
        opt_lines deep-state "${IN_DEEP_STATE:-}"
        opt_lines baseline "${IN_BASELINE:-}"
        opt_bool har "${IN_HAR:-false}"
        opt_lines verify-url "${IN_VERIFY_URL:-}"
        opt_lines verify-wait "${IN_VERIFY_WAIT:-}"

        "${RUNNER[@]}" "${ARGS[@]}"
