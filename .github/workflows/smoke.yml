name: Smoke test

# Probelauf der Action gegen die eigene Website (cuonztech.ch) auf einem echten GitHub-Runner.
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run action from this checkout
        id: cpcg
        uses: ./
        continue-on-error: true
        with:
          staging-url: https://cuonztech.ch

      - name: Report result
        env:
          GATE_STATE: ${{ steps.cpcg.outputs.gate_state }}
          EXIT_CODE: ${{ steps.cpcg.outputs.exit_code }}
          LEAKS: ${{ steps.cpcg.outputs.leaks-count }}
          INCOMPLETE: ${{ steps.cpcg.outputs.incomplete }}
          OUTCOME: ${{ steps.cpcg.outcome }}
        run: |
          echo "::notice title=CPCG smoke::outcome=$OUTCOME gate_state=$GATE_STATE exit_code=$EXIT_CODE leaks=$LEAKS incomplete=$INCOMPLETE"
